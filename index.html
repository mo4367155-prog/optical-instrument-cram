<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ef"><title>抱佛腳練習器｜Ch 7 光學儀器</title>
<style>
:root{--ink:#17231f;--muted:#69736e;--paper:#f5f3ef;--card:#fffefa;--green:#245b47;--lime:#d8f276;--line:#e7e5dd;--red:#a94739;--shadow:0 16px 48px #27352b12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 5%,#e7eddb 0,transparent 34%),var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}.wrap{width:min(1040px,100%);margin:auto;padding:28px 22px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}.brandmark{height:34px;width:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:17px}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:99px;background:#ffffff9c}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--green);font-weight:800;font-size:11px}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.02;letter-spacing:-.06em;margin:9px 0 11px}.hero p{color:var(--muted);margin:0;line-height:1.6}.stats{display:flex;gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 15px;min-width:86px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}.panel,.quiz{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:19px;position:sticky;top:16px}.panel h2{font-size:14px;margin:0 0 17px}.field{margin:0 0 15px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:7px}.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fffefa;color:var(--ink);font-size:13px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eeede7;padding:4px;border-radius:11px}.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;color:var(--muted);font-weight:700;font-size:12px}.seg button.active{background:#fffefa;color:var(--green);box-shadow:0 2px 6px #0000000d}.checkline{display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:12px;margin:15px 0}.switch{width:38px;height:22px;border-radius:99px;background:#d5d7ce;position:relative;border:0;transition:.2s}.switch:after{content:"";width:16px;height:16px;position:absolute;top:3px;left:3px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{left:19px}.start{width:100%;border:0;border-radius:11px;background:var(--green);color:white;font-weight:800;padding:12px;margin-top:2px}.start:hover,.primary:hover{filter:brightness(1.08)}.subbtn{width:100%;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:10px;margin-top:8px;font-size:12px;font-weight:700}.quiz{padding:clamp(20px,4vw,34px);min-height:540px}.quizhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.track{height:5px;border-radius:6px;background:#eeede7;margin:14px 0 34px;overflow:hidden}.track i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}.typeTag{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--green);font-weight:800}.prompt{text-align:center;padding:12px 0 10px}.prompt .word{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(28px,5vw,46px);line-height:1.25;letter-spacing:-.025em;overflow-wrap:anywhere}.prompt .direction{font-size:12px;color:var(--muted);margin-top:10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:620px;margin:25px auto 0}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;padding:15px 16px;color:var(--ink);min-height:58px;transition:.15s}.choice:hover{border-color:#9bb8a7;transform:translateY(-1px)}.choice .letter{font-size:10px;font-weight:800;color:#929a94;margin-right:9px}.choice.selected{border-color:var(--green);background:#f1f6ef}.choice.correct{border-color:#65a67c;background:#edf8ef;color:#21573a}.choice.wrong{border-color:#d1887e;background:#fff2ef;color:var(--red)}.answer{display:flex;gap:8px;max-width:590px;margin:25px auto 0}.answer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:14px;background:white;outline:none}.answer input:focus{border-color:#81a28f;box-shadow:0 0 0 3px #245b4712}.primary{border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:800;padding:0 20px}.feedback{max-width:620px;margin:20px auto 0;padding:14px 16px;border-radius:12px;line-height:1.55;font-size:13px}.feedback.good{background:#edf7ef;color:#245c3c}.feedback.bad{background:#fff2ef;color:#8b3d33}.feedback b{display:block;margin-bottom:2px}.actions{display:flex;justify-content:center;gap:9px;margin-top:20px}.soft{border:1px solid var(--line);background:#fffefa;padding:10px 14px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.next{border:0;background:var(--green);color:white;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:800}.empty{height:450px;display:grid;place-items:center;text-align:center}.empty .icon{font-size:35px}.empty h3{margin:10px 0 5px;font-size:20px}.empty p{color:var(--muted);max-width:310px;line-height:1.55;font-size:13px;margin:auto}.summary{text-align:center;padding:48px 12px}.summary .big{font-size:46px}.summary h2{font-size:27px;margin:12px 0 5px}.summary p{color:var(--muted)}.summary .result{font-size:40px;font-weight:850;letter-spacing:-.06em;margin:20px}.wrongbox{margin:18px auto 0;max-width:600px;text-align:left;background:#f5f3ef;border-radius:12px;padding:15px;font-size:13px;line-height:1.8;max-height:150px;overflow:auto}.footer{font-size:11px;color:#89918b;text-align:center;margin-top:18px}.link{border:0;background:none;color:var(--green);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:7px}.hide{display:none!important}@media(max-width:760px){.wrap{padding:20px 14px 35px}.hero{display:block}.stats{margin-top:18px}.layout{grid-template-columns:1fr}.panel{position:static;order:2}.quiz{min-height:500px;order:1}.choices{grid-template-columns:1fr}.top{margin-bottom:25px}.pill{font-size:10px}.empty{height:350px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="brandmark">✳</div><span>抱佛腳練習器</span></div><div class="pill">CH 7 · OPTICAL INSTRUMENTS</div></header>
<section class="hero"><div><div class="eyebrow">Last-minute study club</div><h1>趁現在，<span style="color:#71927c">多記幾個。</span></h1><p>把單字拆成一題一題，腦袋比較不會直接登出。</p></div><div class="stats"><div class="stat"><b id="statDone">0</b><span>累積作答</span></div><div class="stat"><b id="statMaster">0</b><span>答對累計</span></div></div></section>
<div class="layout"><aside class="panel"><h2>這輪怎麼練</h2><div class="field"><label>題目方向</label><select id="direction"><option value="en-zh">英文 → 中文</option><option value="zh-en">中文 → 英文</option><option value="mix">混合方向</option></select></div><div class="field"><label>題目數量</label><select id="count"><option value="10">10 題・快速熱身</option><option value="20">20 題・考前衝刺</option><option value="all">全部單字</option><option value="wrong">只練錯題</option></select></div><div class="field"><label>作答方式</label><div class="seg"><button id="modeChoice" class="active">選擇題</button><button id="modeType">自己輸入</button></div></div><div class="checkline"><span>優先抽出錯題</span><button class="switch" id="prioritize" aria-label="優先抽出錯題"></button></div><button class="start" id="start">開始這輪 →</button><button class="subbtn" id="clearWrong">清除錯題紀錄</button><div class="footer">題庫取自你提供的 Ch 7 單字表</div></aside>
<main class="quiz" id="quiz"><div class="empty"><div><div class="icon">📚</div><h3>來一輪短衝吧</h3><p>選題目方向和數量，按「開始這輪」。答錯的單字會自動收進錯題本。</p></div></div></main></div></div>
<script>
const vocab = [
["Optical Instruments","光學儀器"],["spectroscopic methods","光譜法"],["Nonradiative transition","非輻射躍遷"],["Fluorescence","螢光"],["Phosphorescence","磷光"],["Scattering","散射（光）"],["Emission","放射（光）；發射"],["Chemiluminescence","化學冷光"],["Source","光源"],["Sample holder","樣品槽"],["Wavelength selector","波長選擇器"],["Detector","偵測器"],["Transducer","傳感器；偵測器"],["Instrumental analysis","儀器分析"],["Wavelength","波長"],["Frequency","頻率"],["Relationship","關係"],["Wavenumber","波數"],["Application","應用"],["Visible region","可見光區"],["Tungsten filament lamp","鎢絲燈"],["UV region","紫外光區"],["coherent","同調性"],["Semiconductor","半導體"],["Spontaneous emission","自發射；自動放射"],["Stimulated emission","刺激放射"],["monochromatic radiation","單色光"],["Random Process","隨機過程"],["Population Inversion","粒子數反轉；居量反轉"],["Light Amplification","光放大"],["Resolution","解析度"],["Holographic Gratings","全像光柵"],["diffraction order","繞射級數"],
["Components","組件；組成"],["Phenomenon","現象（單數）"],["Phenomena","現象（複數）"],["Light attenuation","光衰減"],["Absorption","吸收"],["Interference filter","干涉濾片"],["Effective bandwidth","有效帶寬"],["Dielectric layer","介電層"],["Reinforcement interference","強化干涉；建設性干涉"],["Constructive interference","建設性干涉"],["Destructive interference","破壞性干涉"],["Transmittance","穿透率；透光率"],["Transparency","透明度"],["Performance","表現"],["Absorption Filter","吸收濾片"],["continuous spectrum","連續光譜"],["Slit width","狹縫寬度"],["Reflection grating","反射光柵"],["Entrance slit","入口夾縫"],["Comparison","比較"],["Focal plane","聚焦平面"],["Linear dispersion","線性分散"],["Prism Monochromator","三菱鏡單光器"],["Determination","測定；決定"],["Grating Monochromators","光柵單光器"],["incident angle","入射角"],["Reflected angle","反射角"],["Grating normal","光柵法線"],["Polychromatic beam","多色光束"],["Stray radiation","雜訊輻射；迷光"],["Light-gathering power","聚光能力"],["Spectral bandwidth","光譜帶寬"],["Resolving Power","解析力"],
["Sample container","樣品槽；樣品瓶"],["emission spectroscopy","發射光譜"],["cells (or cuvettes)","樣品槽"],["Quartz","石英"],["fused silica","熔融矽"],["Transparent","透明的"],["Ideal Transducer","理想的偵測器"],["Properties","性質"],["Signal-to-Noise ratio (S/N)","訊噪比"],["Illumination","照明"],["dark current","暗電流"],["Measurement","量測"],["Photon transducer","光子偵測器"],["thermal transducer","熱偵測器"],["Fast response time","快速反應時間"],["real transducer","真正的偵測器"],["photoelectric transducer","光電偵測器"],["Disadvantage","缺點"],["Output current","輸出電流"],["Advantage","優點"],["portable","可攜帶的"],["Rugged","堅固的"],["Fatigue","疲勞"],["Reverse bias","逆向偏壓（反向偏壓）"],["Photomultiplier Tubes (PMT)","光電倍增管"],["optical fiber","光纖"],["in phase","同相位"],["out phase","異相位"],["photoemissive material","光電發射材料"],["Interferogram","干涉圖"],
["Spectrometer","光譜儀"],["Photoelectric effect","光電效應"],["Colorimeter","比色計"],["Photometer","光度計"],["Spectrophotometer","分光光度計"],["Spectrofluorometer","分光螢光計"],["Fourier Transform","傅立葉轉換"],["Simultaneously","同時地"],["Modulate","調變"],["Michelson Interferometer","麥克爾遜干涉儀"],["Frequency domain","頻率領域；頻域"],["Encode","編碼"],["Decode","解碼"],["Inherent","與生俱來的"],["Throughput","通量"],["Depletion layer","淨空層"],["Photodiode Arrays (PDA)","光二極體陣列"],["Silicon Photodiode Transducers","矽光二極體偵測器"],["Reproducibility","再現性"],["Conventional IR","傳統的紅外光"],["Time domain","時間領域"],["Spectrometry","光譜法"],["Spectroscopy","光譜學"],["Inexpensive","便宜的"],["Amplitude modulation (AM)","調幅"],["Frequency modulation (FM)","調頻"],["Distorting","扭曲"],["split a beam","分裂光束"],["Retardation","延遲"],["Miniaturized","微小化"]
];
const $=id=>document.getElementById(id);let typed=false,queue=[],idx=0,answered=false,currentMode="choice",selected="";let saved=JSON.parse(localStorage.getItem("cram-optics-v1")||'{"done":0,"correct":0,"wrong":[]}');
function stats(){ $('statDone').textContent=saved.done; $('statMaster').textContent=saved.correct; localStorage.setItem("cram-optics-v1",JSON.stringify(saved)); }
function norm(s){return s.toLowerCase().trim().replace(/[\s\p{P}\p{S}]/gu,"")}
function setMode(m){currentMode=m;$('modeChoice').classList.toggle('active',m==='choice');$('modeType').classList.toggle('active',m==='type')}
$('modeChoice').onclick=()=>setMode('choice');$('modeType').onclick=()=>setMode('type');$('prioritize').onclick=()=> $('prioritize').classList.toggle('on');
function start(){const dir=$('direction').value;let n=$('count').value;let pool=vocab.map((v,i)=>({v,i}));if(n==='wrong'){pool=pool.filter(x=>saved.wrong.includes(x.i));if(!pool.length){$('quiz').innerHTML='<div class="empty"><div><div class="icon">✨</div><h3>錯題本目前是空的</h3><p>先練幾題，錯過的單字就會自動收進來。</p></div></div>';return}}if($('prioritize').classList.contains('on'))pool.sort((a,b)=>Number(saved.wrong.includes(b.i))-Number(saved.wrong.includes(a.i)));else pool.sort(()=>Math.random()-.5);if(n!=='all'&&n!=='wrong')pool=pool.slice(0,Number(n));queue=pool.map(x=>({v:x.v,i:x.i,dir:dir==='mix'?(Math.random()<.5?'en-zh':'zh-en'):dir}));idx=0;render()}
$('start').onclick=start;
function render(){answered=false;selected='';if(idx>=queue.length){finish();return}const q=queue[idx],front=q.dir==='en-zh'?q.v[0]:q.v[1],answer=q.dir==='en-zh'?q.v[1]:q.v[0];let body='';if(currentMode==='choice'){let opts=[answer];while(opts.length<4){const other=vocab[Math.floor(Math.random()*vocab.length)][q.dir==='en-zh'?1:0];if(!opts.includes(other))opts.push(other)}opts.sort(()=>Math.random()-.5);body='<div class="choices">'+opts.map((o,k)=>`<button class="choice" data-value="${esc(o)}"><span class="letter">${String.fromCharCode(65+k)}</span>${esc(o)}</button>`).join('')+'</div>'}else body=`<form class="answer" id="answerForm"><input id="typedAnswer" autocomplete="off" placeholder="輸入${q.dir==='en-zh'?'中文意思':'英文單字'}…" autofocus><button class="primary">確認</button></form>`;
$('quiz').innerHTML=`<div class="quizhead"><span>第 ${idx+1} / ${queue.length} 題</span><span class="typeTag">${currentMode==='choice'?'選擇題':'拼寫作答'}</span></div><div class="track"><i style="width:${Math.round(idx/queue.length*100)}%"></i></div><div class="prompt"><div class="word">${esc(front)}</div><div class="direction">${q.dir==='en-zh'?'選出正確中文':'選出正確英文'}</div></div>${body}<div id="feedback"></div><div class="actions hide" id="actionRow"><button class="soft" id="reveal">看答案</button><button class="next" id="next">下一題 →</button></div>`;
if(currentMode==='choice')document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>check(b.dataset.value));else $('answerForm').onsubmit=e=>{e.preventDefault();check($('typedAnswer').value)};
$('reveal').onclick=()=>{const f=$('feedback');f.className='feedback';f.innerHTML=`答案：<b>${esc(answer)}</b>`};$('next').onclick=()=>{idx++;render()};}
function check(input){if(answered||!input.trim())return;answered=true;const q=queue[idx],expected=q.dir==='en-zh'?q.v[1]:q.v[0];let ok=norm(input)===norm(expected);if(!ok&&q.dir==='en-zh'){ok=expected.split(/[；，、]/).some(a=>norm(input)===norm(a))}saved.done++;if(ok){saved.correct++;saved.wrong=saved.wrong.filter(i=>i!==q.i)}else if(!saved.wrong.includes(q.i))saved.wrong.push(q.i);stats();if(currentMode==='choice')document.querySelectorAll('.choice').forEach(b=>{if(norm(b.dataset.value)===norm(expected))b.classList.add('correct');else if(norm(b.dataset.value)===norm(input))b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?'<b>漂亮，記住了！✦</b>':'<b>差一點，這題收進錯題本了。</b>正確答案：'+esc(expected);$('actionRow').classList.remove('hide');$('reveal').classList.add('hide')}
function finish(){let correct=queue.filter(q=>!saved.wrong.includes(q.i)).length;let wrong=queue.filter(q=>saved.wrong.includes(q.i));$('quiz').innerHTML=`<div class="summary"><div class="big">${wrong.length?'🧠':'🎉'}</div><h2>${wrong.length?'這輪收工，錯題留著下輪見':'漂亮收尾！'}</h2><p>本輪完成 ${queue.length} 題</p><div class="result">${Math.round((queue.length-wrong.length)/queue.length*100)}<span style="font-size:20px">%</span></div><p>本輪答對率</p>${wrong.length?'<div class="wrongbox"><b>本輪錯題</b><br>'+wrong.map(q=>esc(q.v[0]+' — '+q.v[1])).join('<br>')+'</div>':''}<div class="actions"><button class="soft" onclick="start()">再來一輪</button><button class="next" onclick="document.getElementById(\'count\').value=\'wrong\';start()">${wrong.length?'重練錯題':'再刷錯題本'} →</button></div></div>`}
$('clearWrong').onclick=()=>{saved.wrong=[];stats();$('quiz').innerHTML='<div class="empty"><div><div class="icon">🧹</div><h3>錯題本清空了</h3><p>好，腦內暫存歸零。準備好就再開一輪。</p></div></div>'};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}stats();
</script></body></html>
